<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Automation</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1a1d23; --muted: #626b7a;
      --border: #dfe3e8; --accent: #2457d6; --ok-bg: #e7f6ec; --ok: #17663a;
      --bad-bg: #fdecec; --bad: #a32020;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--border); }
    header a { display: block; max-width: 880px; margin: 0 auto; padding: 14px 16px;
      color: var(--text); font-weight: 600; text-decoration: none; }
    main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 20px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .button { display: inline-block; background: var(--accent); color: #fff; border: 0;
      border-radius: 8px; padding: 9px 16px; font: inherit; cursor: pointer; text-decoration: none; }
    .button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    .button:disabled { opacity: .5; cursor: not-allowed; }
    .alert { border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
    .alert.bad { background: var(--bad-bg); color: var(--bad); }
    .alert.ok { background: var(--ok-bg); color: var(--ok); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 13px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.flagged td { background: var(--bad-bg); }
    dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 0; }
    dt { color: var(--muted); font-size: 13px; }
    dd { margin: 0; font-weight: 500; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <header><a href="/">Invoice Automation</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
